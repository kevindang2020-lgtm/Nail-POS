# AI PowerSalon — container image build, scan and (manual, approved) publish.
# BUILD_PLAN Phase 11 — Constitution 4 §71/§73 (CD + immutable artifacts), §141/§142 (container security), §78–80 (IaC).
#
#   build-scan  every push + pull request: docker build of the API image (the Dockerfile Railway builds), Trivy image
#               scan (fails on a CRITICAL vulnerability that HAS a fix), Trivy IaC scan of Dockerfile + deploy/ (fails on
#               CRITICAL), and a CycloneDX SBOM uploaded as an artifact. No secrets: this job's token can only read.
#   publish     OFF BY DEFAULT. Runs only on a manual "Run workflow" with publish = true, AND only after a reviewer approves
#               the `production-image` environment (Settings → Environments → required reviewers). Pushes ONE immutable
#               tag — the git commit sha — to GHCR. Never `latest`. Railway then deploys that exact image (steps below).
#
# Supply chain: aquasecurity/trivy-action tags 0.0.1–0.34.2 were force-pushed to malicious commits in March 2026
# (CVE-2026-33634); 0.35.0 is the first safe release and Trivy itself is pinned to v0.69.3 (0.69.4 was the bad binary).
# Security Deep Scan B5 (Oct 23 2026): every action is pinned to the full commit SHA its tag pointed to on Oct 23 2026
# (resolved with git ls-remote); Dependabot (github-actions ecosystem) proposes SHA bumps for review.
# The scan jobs hold no secrets, so a compromised scanner here can read the code but cannot publish or deploy.
name: build-image

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the image to GHCR (tag = commit sha). Requires approval of the production-image environment.'
        type: boolean
        default: false

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: aipowersalon-api
  TRIVY_VERSION: v0.69.3

jobs:
  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the API image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image starts as a non-root user and ships the start-up scripts
        run: |
          test "$(docker run --rm --entrypoint id ${IMAGE_NAME}:${GITHUB_SHA} -un)" = "node"
          docker run --rm --entrypoint sh ${IMAGE_NAME}:${GITHUB_SHA} -c 'test -f dist/main.js && test -f dist/worker.js && test -f scripts/migrate.mjs && test -f scripts/db-preflight.mjs && test -f db/migration-sql.mjs && test -f db/retention-policy.json && node -e "require(\"@aipowersalon/media\")"'

      - name: Trivy — image vulnerabilities (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy — IaC misconfiguration (Dockerfile, deploy/ incl. the legacy Terraform)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          trivy-config: .github/trivy-iac.yaml
          severity: CRITICAL
          exit-code: '1'
          format: table

      - name: SBOM (CycloneDX) of the exact image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ env.IMAGE_NAME }}-${{ github.sha }}.cdx.json
          skip-setup-trivy: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ env.IMAGE_NAME }}-${{ github.sha }}.cdx.json
          retention-days: 90

  publish:
    # Gated off: manual dispatch with publish = true, then a human approves the protected environment.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: build-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-image
    permissions:
      contents: read
      packages: write          # push to ghcr.io/<owner>/aipowersalon-api — nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image reference (GHCR needs a lower-case owner)
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing tag (immutable artifacts)
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" > /dev/null 2>&1; then
            echo "::error::${{ steps.ref.outputs.image }} already exists — a published tag is never rebuilt"; exit 1
          fi
      - name: Build and push (tag = commit sha only)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true
      - name: How to deploy this image on Railway
        run: |
          {
            echo "## Published ${{ steps.ref.outputs.image }}"
            echo
            echo "Railway (host of record) — deploy this exact image:"
            echo "1. Web service → Settings → Source → Connect Image → \`${{ steps.ref.outputs.image }}\`"
            echo "   (private GHCR: add a registry credential — a GitHub token with read:packages — in the same panel)."
            echo "2. Settings → Deploy → Pre-deploy command: \`sh -c \"node scripts/db-preflight.mjs && node scripts/migrate.mjs\"\`"
            echo "   Start command: \`node dist/main.js\`. Healthcheck path: \`/health/ready\`. (An image source does not read railway.json.)"
            echo "3. Worker service: same image, start command \`node dist/worker.js\`, PROCESS_ROLE=worker, NO pre-deploy command."
            echo "4. Deploy the web service first (its pre-deploy migrates), then the worker. Roll back = point both at the previous sha."
          } >> "$GITHUB_STEP_SUMMARY"
